<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="定休日や祝日の営業ルールを設定するだけで、店舗の営業日カレンダーを自動作成。個人経営や小規模店舗でも簡単に使え、作成したカレンダーは画像として保存できます。"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Omische" />
    <meta
      property="og:title"
      content="営業日カレンダーをかんたん自動作成 | Omische"
    />
    <meta
      property="og:description"
      content="定休日や祝日の営業ルールから、店舗の営業日・休業日カレンダーを自動作成。完成したカレンダーは画像として保存できます。"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>営業日カレンダーをかんたん自動作成 | Omische</title>
  </head>
  <body>
    <div id="root">
      <main class="app theme-natural">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">営</span>
            <div>
              <strong>Omise Calendar</strong>
              <small>営業日カレンダー</small>
            </div>
          </div>
        </header>
        <section class="workspace">
          <section class="panel">
            <div class="wizard static-introduction">
              <p class="eyebrow">店舗向け営業カレンダー作成</p>
              <h1>お店の営業日カレンダーを、かんたんに。</h1>
              <p>
                Omischeは、個人経営や小規模店舗向けの営業日カレンダー作成サービスです。定休日や第N曜日、祝日の営業・休業ルールから毎月の営業日と休業日を自動計算し、完成したカレンダーを画像として保存してInstagramなどSNSでの営業案内にも使えます。
              </p>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
